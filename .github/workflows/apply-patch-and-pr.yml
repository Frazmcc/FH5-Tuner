name: Apply Patch and Create PR
on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: 'Patch folder under .github/patches/'
        required: true
        default: '.github/patches/feature-tuner-prototype'
      branch_name:
        description: 'PR branch name'
        required: true
        default: 'feature/tuner-prototype'
      pr_title:
        description: 'Pull request title'
        required: true
        default: 'feat: add FH5 tuner prototype'
      pr_body:
        description: 'Pull request body'
        required: true
        default: 'Apply prepared patch'
permissions:
  contents: write
  pull-requests: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    env:
      PATCH_PATH: ${{ inputs.patch_path }}
      BRANCH_NAME: ${{ inputs.branch_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate dispatch inputs and apply patch without deleting repository files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PATCH_PATH" =~ ^\.github/patches/[A-Za-z0-9_./-]+$ ]] || { echo "::error::Invalid patch path"; exit 1; }
          [[ "$BRANCH_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,100}$ ]] || { echo "::error::Invalid branch name"; exit 1; }
          [[ "$BRANCH_NAME" != *..* && "$BRANCH_NAME" != */.git* && "$BRANCH_NAME" != *//*
            && "$BRANCH_NAME" != */ && "$BRANCH_NAME" != *".lock" ]] || exit 1
          git check-ref-format --branch "$BRANCH_NAME"
          root="$(realpath -e "$GITHUB_WORKSPACE/.github/patches")"
          candidate="$(realpath -e "$GITHUB_WORKSPACE/$PATCH_PATH")"
          [[ -d "$candidate" && "$candidate" == "$root/"* ]] || { echo "::error::Patch escapes trusted folder"; exit 1; }
          if find "$candidate" -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links not permitted in patch"; exit 1
          fi
          git switch -c "$BRANCH_NAME"
          cp -a "$candidate/." "$GITHUB_WORKSPACE/"
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply validated prepared patch'
            git push origin "$BRANCH_NAME"
          fi
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.branch_name }}
          title: ${{ inputs.pr_title }}
          body: ${{ inputs.pr_body }}
